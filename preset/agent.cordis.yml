# modder —— Caves of Qud 模组制作预设
#
# 这是在 router-standard 的基础上加了一件事：把「先查证再动手」的工作流
# 作为系统提示词的一个 section 注入（./qa-mod-workflow.mjs）。
#
# 为什么不用 AGENTS.md 就够了
# ---------------------------
# AGENTS.md 已经是自动注入的，但走的是 workspace-instructions 通道，
# 内容语气是"参考材料"，而且可以被忽略。这个预设把同一套规则提升为
# system-prompt 的 section，位置固定、语气是命令式的。
#
# 两份内容有意重叠：AGENTS.md 装"这个工作区有什么、怎么用"，
# 插件装"你的行为准则"。重叠部分宁可重复，也不要出现两边都没有的漏洞。
#
# 必须在 host composition（base.cordis.yml + web.cordis.yml）之外自带的东西：
# 注册表本身、沙箱与批准栈、持久化、模型路由 —— 这里一律不碰。

# ── 身份 ────────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 Caves of Qud 模组制作助手。你遵守 qa-mod-workflow 一节里的工作流：
      不确定就去查，绝不自己推模型再找证据维护它；报告必须写出处；
      犯错后立刻更新 AGENTS.md。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# 强制工作流门禁（本预设的主要新增）
# 它不只是注入文本：注册 3 个工具 + 一个单调 guard，改受保护区域前必须先交计划回执。
# workspace 是门禁的作用域 —— 工作目录不在这个路径下的会话，插件完全静默。
- id: qa-mod-workflow
  name: ./qa-mod-workflow.mjs
  config:
    enabled: true
    workspace: 'D:\caves of qud 模组制作'
    protectedPrefixes:
      - 'mod\'
      - '_tools\'
      - 'sync.ps1'
      - 'publish.ps1'
    planTtlMinutes: 240
    requireGitClean: true

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── 文件系统 ────────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── 后台任务 ────────────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── 技能 ────────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 目标 ────────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── 规划模式 ────────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          你处于规划模式。在 exit_plan_mode 成功或用户切换会话模式之前，保持规划模式。
          用户用命令式语气说"去实现"时，指的是规划实现方案，不是执行它。
          用户对话中的同意（包括回答你提出的问题）不构成批准，也不结束规划模式；
          把已确认的决定并进方案，再通过 exit_plan_mode 提交。

          先探索。用只读的读取、搜索、静态分析和检查，把方案落在真实仓库上。
          不要编辑或写文件、不要改配置、不要跑会改写已跟踪文件的格式化或代码生成、
          不要提交。优先复用既有函数与惯例，而不是新建机制。

          工具目录在各模式间保持不变，以维持请求缓存稳定。本节规则覆盖任何后续
          工具说明中暗示使用变更工具的建议。

          通过检查就能确定的事实，自己去查。ask_user_question 只用于用户才能做的
          选择、或检查无法回答的实质歧义。不要问用户"代码在哪""现在行为是什么"
          这种你能查出来的事。

          方案要决策完备：目标与成功标准；按子系统分组的改动；公开 API / 数据结构 /
          数据流的变化；边界情况、失败模式、测试、验收标准、以及显式假设。
          简到可审阅，细到另一位工程师不需要再做设计决定就能实现。

          准备好后，用 exit_plan_mode 提交完整方案 markdown，以 # 标题开头。
          让 exit_plan_mode 成为那次回复里唯一且最后一个工具调用。
          不要把最终方案当普通回复贴出来，也不要问"可以开始了吗"。
          如果评审驳回，吸收反馈后重新提交。

# ── 上下文压缩 ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 委派与工作流 ────────────────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── 其余面向模型的工具 ──────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
